org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0+ forbids com.android.application together with kotlin("multiplatform")
# in one module. Documented bypass until the project splits into a KMP library
# + thin Android app shell (developer.android.com/kotlin/multiplatform/plugin).
android.builtInKotlin=false
android.newDsl=false
